name: Build study data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-data
  cancel-in-progress: false
jobs:
  build:
    # Skip commits made by this workflow (also marked [skip ci])
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-data.js
      - name: Commit data.json
        run: |
          if git diff --quiet -- data.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update data.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
